---
- id: terraform-fmt
  name: terraform-fmt
  entry: terraform-fmt
  description: Rewrite Terraform/OpenTofu configuration files to a canonical format and style. Auto-detects tofu, falls back to terraform.
  language: python
  files: \.(tf|tfvars|tofu|tofuvars)$
  exclude: \.terraform\/.*$

- id: tofu-fmt
  name: tofu-fmt
  entry: tofu-fmt
  description: Rewrite OpenTofu configuration files to a canonical format and style (alias of terraform-fmt, prefers tofu binary).
  language: python
  files: \.(tf|tfvars|tofu|tofuvars)$
  exclude: \.terraform\/.*$

- id: checkov-scan
  name: checkov
  description: runs checkov over a project, cross platform compatible
  entry: checkov-scan
  language: python
  files: \.(tf|tofu)$
  exclude: \.terraform\/.*$
  always_run: false
  pass_filenames: false
  additional_dependencies: ['checkov']

- id: tf2docs
  name: tf2docs
  description: builds markdown docs, cross platform compatible
  entry: tf2docs
  language: python
  files: \.(tf|tofu)$
  exclude: \.terraform\/.*$
  always_run: false
  pass_filenames: true
  require_serial: true
